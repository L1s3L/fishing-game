<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel Pier - World Fishing</title>
<style>
:root{--line:#2d3a63;--acc:#f2c14e;--dim:#9aa7c9;--ok:#5ee08a;--bad:#ff8080;--p2:#1b2442}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070b16;color:#eef2ff;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,calc(100vh*4/3));width:min(100vw,calc(100dvh*4/3));aspect-ratio:4/3;container-type:inline-size;user-select:none;-webkit-user-select:none;font-size:1.5cqw}
canvas#c{width:100%;height:100%;display:block;touch-action:none;background:#000}
img{-webkit-user-drag:none;user-select:none}
#tb{position:absolute;top:1.1cqw;right:1.1cqw;display:flex;gap:.6cqw;z-index:5}
.btn{font:inherit;font-size:1.35cqw;font-weight:600;display:inline-flex;align-items:center;gap:.6cqw;background:rgba(24,34,68,.92);color:#eef2ff;border:1px solid var(--line);border-radius:.8cqw;padding:.65cqw 1.1cqw;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:#2a3a6e;border-color:#5a6ea8}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:#1f7a47;border-color:#2fa862}.btn.go:hover{background:#26935a}
.btn.sm{padding:.45cqw .85cqw;font-size:1.25cqw}
.btn svg{width:1.7cqw;height:1.7cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#modal{display:none;position:absolute;inset:6% 7%;z-index:10;background:rgba(14,21,44,.99);border:1px solid var(--line);border-radius:1.4cqw;padding:2cqw;box-shadow:0 1cqw 4cqw rgba(0,0,0,.6);font-size:1.4cqw;line-height:1.35;overflow:hidden;flex-direction:column;gap:1cqw}
#modal.show{display:flex;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.98)}}
.mh{display:flex;align-items:center;gap:1.2cqw}
.mh h2{margin:0;font-size:2.2cqw;font-weight:700;flex:1}
.coins{color:var(--acc);font-weight:700;display:inline-flex;align-items:center;gap:.5cqw}
.md{color:var(--dim);font-size:1.3cqw;min-height:1.8cqw}
.mt{display:flex;gap:.6cqw;align-items:center;color:var(--dim)}
.tab.on{background:var(--acc);color:#241a02;border-color:var(--acc)}
select{font:inherit;font-size:1.3cqw;background:#1b2442;color:#eef2ff;border:1px solid var(--line);border-radius:.7cqw;padding:.45cqw .8cqw}
.mb{flex:1;min-height:0;display:grid;grid-template-columns:1.3fr 1fr;gap:1.4cqw}
.mapb{grid-template-columns:2.5fr 1fr}
.mapb canvas{width:100%;aspect-ratio:2/1;height:auto;border:1px solid var(--line);border-radius:.8cqw;cursor:crosshair;align-self:start}
.list{display:flex;flex-direction:column;gap:.5cqw;min-height:0;overflow:hidden}
.row{display:flex;align-items:center;gap:1cqw;height:5.7cqw;flex:none;padding:0 1cqw;background:var(--p2);border:1px solid var(--line);border-radius:.8cqw;transition:background .12s,border-color .12s}
.row:hover{background:#26335c;border-color:#5a6ea8}
.row.on{border-color:var(--acc)}
.row img{width:4cqw;height:4cqw;object-fit:contain;image-rendering:pixelated;flex:none;pointer-events:none}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .nm small{display:block;color:var(--dim);font-weight:400;font-size:1.15cqw;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--dim);padding:1cqw}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:6.2cqw;gap:.6cqw;align-content:start;min-height:0;overflow:hidden}
.tile{display:flex;align-items:center;justify-content:center;background:var(--p2);border:1px solid var(--line);border-radius:.7cqw;transition:background .12s,border-color .12s}
.tile:hover{background:#26335c;border-color:#5a6ea8}
.tile img{max-width:88%;max-height:88%;image-rendering:pixelated;pointer-events:none}
.detail{background:#0b1128;border:1px solid var(--line);border-radius:.8cqw;padding:1.2cqw 1.4cqw;overflow:hidden;min-height:0;color:#eef2ff}
.detail h3{margin:0 0 .3cqw;font-size:1.9cqw;color:var(--acc)}
.detail p{margin:.2cqw 0 .6cqw}
.detail img.big{display:block;height:8cqw;width:auto;max-width:100%;margin:0 auto .5cqw;image-rendering:pixelated;pointer-events:none}
.st{display:flex;justify-content:space-between;gap:1cqw;padding:.3cqw 0;border-bottom:1px solid #1d2748;font-size:1.3cqw}
.st>i,.st>span:first-child{font-style:normal;color:#8d9bc4}
.st b{font-weight:600;text-align:right}
.mapact{margin-top:1cqw}
.dim{color:var(--dim)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.badge{display:inline-block;background:var(--acc);color:#241a02;border-radius:.5cqw;padding:.15cqw .6cqw;font-size:1.1cqw;font-weight:700}
.badge.dim{background:#3a4468;color:#cfd6ee}
.mf{display:flex;align-items:center;gap:1cqw;justify-content:space-between;min-height:3.6cqw;color:var(--dim)}
.pager{display:flex;align-items:center;gap:.8cqw}
.dot{display:inline-block;width:1.1cqw;height:1.1cqw;border-radius:50%;margin:0 .3cqw 0 1cqw;vertical-align:-.1cqw}
.dot.g{background:#6aff8a}.dot.r{background:#ff4a4a}.dot.y{background:#ffd75e}
#rodp{position:absolute;left:0;right:0;bottom:0;height:48%;z-index:9;padding:1.2cqw 2cqw 1.2cqw;display:flex;flex-direction:column;gap:.6cqw;background:linear-gradient(180deg,rgba(8,13,30,.5),rgba(8,13,30,.9));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.15);transform:translateY(105%);opacity:0;transition:transform .32s cubic-bezier(.2,.85,.25,1),opacity .25s;pointer-events:none}
#rodp.show{transform:none;opacity:1;pointer-events:auto}
.rph{display:flex;align-items:center;gap:1.4cqw}.rph b{font-size:1.9cqw}
#rpinfo .st{padding:.15cqw 0;font-size:1.15cqw}#rpinfo{width:30cqw;flex:none;color:var(--dim);font-size:1.2cqw;line-height:1.3;background:rgba(8,13,30,.55);border:1px solid #2a3560;border-radius:.8cqw;padding:1cqw 1.3cqw;overflow:hidden}#rpinfo h3{margin:0 0 .3cqw;font-size:1.6cqw;color:#ffd75e}#rpinfo p{margin:0 0 .5cqw}.rpm{display:flex;gap:1.5cqw;flex:1;min-height:0}.rpc{flex:1;min-width:0;display:flex;flex-direction:column;gap:.6cqw}.rph .dim{flex:1;font-size:1.2cqw}.st i svg{width:1.5cqw;height:1.5cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.3cqw;margin-right:.6cqw}
.rpl{font-size:1.1cqw;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.strip{display:flex;gap:.9cqw;overflow-x:auto;overflow-y:hidden;position:relative;scroll-behavior:smooth;padding:.5cqw .2cqw .5cqw;scrollbar-width:thin;scrollbar-color:#3a4a80 transparent;flex:none}
.card{flex:none;width:11.5cqw;height:9cqw;border-radius:1cqw;border:1px solid rgba(255,255,255,.14);background:rgba(28,40,78,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;cursor:pointer;transition:transform .15s,background .15s,border-color .15s,box-shadow .2s}
.card:hover{transform:translateY(-.5cqw);background:rgba(50,68,125,.75)}
.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,0 0 1.6cqw rgba(242,193,78,.35);background:rgba(90,72,28,.55)}
.card img{height:4.6cqw;width:auto;max-width:90%;image-rendering:pixelated;pointer-events:none}
.card b{font-size:1.2cqw;font-weight:600;text-align:center;line-height:1.15;max-width:95%}
.card small{font-size:1.05cqw;color:var(--dim)}
#bstrip .card{height:6cqw;width:10cqw}#bstrip .card img{height:2.6cqw}
.coins svg{width:1.6cqw;height:1.6cqw;fill:none;stroke:currentColor;stroke-width:2}.mt .tab{font-size:1.25cqw}
#modal{display:flex;visibility:hidden;opacity:0;transform:translateY(1.4cqw) scale(.97);pointer-events:none;transition:opacity .22s ease,transform .3s cubic-bezier(.2,.9,.3,1),visibility 0s .3s}
#modal.show{display:flex;visibility:visible;opacity:1;transform:none;pointer-events:auto;animation:none;transition-delay:0s}
#c{transition:filter .3s}#wrap.dim #c{filter:brightness(.62) saturate(.85)}
.btn{transition:transform .14s cubic-bezier(.2,.9,.3,1),background .15s,border-color .15s,box-shadow .2s}.btn:hover:not(:disabled){transform:translateY(-.15cqw);box-shadow:0 .4cqw 1cqw rgba(0,0,0,.35)}.btn:active:not(:disabled){transform:scale(.95);box-shadow:none}
.row{transition:background .15s,border-color .15s,transform .18s cubic-bezier(.2,.9,.3,1)}.row:hover{transform:translateX(.4cqw)}
.tile{transition:background .15s,border-color .15s,transform .18s cubic-bezier(.2,.9,.3,1)}.tile:hover{transform:scale(1.07);z-index:1}
.in{animation:rowin .32s both cubic-bezier(.2,.9,.3,1)}@keyframes rowin{from{opacity:0;transform:translateY(1cqw)}}
.card.in{animation:cardin .4s both cubic-bezier(.2,.9,.3,1)}@keyframes cardin{from{opacity:0;transform:translateY(2cqw) scale(.94)}}
.swap{animation:swap .2s ease-out}@keyframes swap{from{opacity:.25;transform:translateX(.8cqw)}}
.bump{animation:bump .4s cubic-bezier(.2,.9,.3,1)}@keyframes bump{40%{transform:scale(1.22);color:#fff}}
.chip.on{background:var(--acc);color:#241a02;border-color:var(--acc)}.rps,#rsort{display:flex;align-items:center;gap:.5cqw;flex-wrap:nowrap}#rsort .chip{font-size:1.05cqw;padding:.35cqw .7cqw;white-space:nowrap}.rph .sp{flex:1}
.mapb{display:flex;flex-direction:column;gap:1cqw}.mapb canvas{flex:1;min-height:0;width:auto;max-width:100%;align-self:center;aspect-ratio:2/1;object-fit:contain}
.mapb .detail{flex:none;height:11cqw;display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:2cqw;align-items:center;padding:.8cqw 1.6cqw}.mapb .detail:not(:has(.sg)){display:block}.mapb .detail h3{margin:0}.mapb .detail p{margin:.2cqw 0 0}.sg{display:grid;grid-template-columns:1fr 1fr;gap:0 1.6cqw}.mapact{margin:0;display:flex;justify-content:flex-end}
.pager .btn,.tab{transition:all .15s}
.up{color:#5fe08a!important}.dn{color:#ff6b6b!important}#modal{color:#eef2ff}.mh h2{color:#eef2ff}

/* touch controls */
#touch{display:none;position:fixed;inset:0;z-index:6;pointer-events:none;-webkit-touch-callout:none;touch-action:none}
body.touch #touch{display:block}
#wrap.dim #touch>*{opacity:.25;pointer-events:none}
#touch>*{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#pad{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(24,34,68,.55);border:2px solid rgba(120,140,200,.45)}
#padk{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(242,193,78,.85);border:2px solid #fff3;pointer-events:none}
#tAct{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(34px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;background:rgba(31,122,71,.8);border:3px solid rgba(94,224,138,.7);color:#fff;font:700 15px/1 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
#tAct.on{background:rgba(242,193,78,.9);color:#222}
#tRun{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:calc(max(34px,env(safe-area-inset-bottom)) + 112px);width:64px;height:40px;border-radius:20px;background:rgba(24,34,68,.7);border:2px solid rgba(120,140,200,.5);color:#eef2ff;font:700 13px/1 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
#tRun.on{background:rgba(242,193,78,.9);color:#222}
@media (max-width:760px){
 #tb .btn span{display:none}
 #tb .btn{padding:1.4cqw 1.8cqw}
 #tb .btn svg{width:3.4cqw;height:3.4cqw}
 #modal{zoom:1.7}
 #modal .btn{font-size:inherit}
}
@media (max-width:760px) and (orientation:portrait){body.touch{align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* flat shop UI: solid colours, big text, no glow or motion */
#modal{background:#141b36;border:2px solid #34426e;box-shadow:none;font-size:1.5cqw}
.mh h2{font-size:2.4cqw}
.row{height:6.4cqw;background:#1b2442;border:1px solid #2d3a63;gap:1.2cqw}
.row:hover{background:#222d52;border-color:#4a5a92;transform:none}
.row .nm{font-size:1.6cqw}
.row .nm small{font-size:1.2cqw;margin-top:.15cqw}
.tile:hover{transform:none;background:#222d52}
.btn:hover:not(:disabled){transform:none;box-shadow:none}
.btn:active:not(:disabled){transform:none}
.btn.go{background:#2a8a52;border-color:#2a8a52;color:#fff}
.btn.go:hover{background:#31a05e}
.btn.go:disabled{opacity:1;background:#252d52;border-color:#2d3a63;color:#9aa7c9}
.row .btn{font-size:1.4cqw;padding:.6cqw 1.1cqw;min-width:11cqw;justify-content:center}
.detail{background:#0e1430;padding:1.4cqw 1.6cqw}
.detail h3{color:#fff;font-size:2cqw;margin-bottom:.6cqw}
.detail p{font-size:1.4cqw;line-height:1.45}
.st{font-size:1.4cqw;padding:.45cqw 0}
.in,.card.in,.swap,.bump{animation:none}
</style>

<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="tb"><button class="btn" id="bBag" title="Open bag (B)"><svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span>Bag</span></button><button class="btn" id="bRod" title="Rods and bait (R)"><svg viewBox="0 0 24 24"><path d="M4 20L18 4"/><path d="M18 4v8"/><circle cx="18" cy="14" r="1.6"/></svg><span>Rods &amp; Bait</span></button><button class="btn" id="bDex" title="Fish-Dex (J)"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span>Fish-Dex</span></button><button class="btn" id="bZoom" title="Change zoom (Z)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8.5 11h5M11 8.5v5"/></svg><span>Zoom</span></button><button class="btn" id="bMute" title="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><span id="bMuteT">Sound on</span></button></div>
  <div id="rodp"><div class="rph"><b>Rods &amp; Bait</b><div id="rsort"></div><span class="sp"></span><button class="btn sm" data-act="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Close</button></div><div class="rpm"><div class="rpc"><div class="rpl">Rods</div><div class="strip" id="rstrip"></div><div class="rpl">Bait (used up when you cast)</div><div class="strip" id="bstrip"></div></div><div id="rpinfo">Hover a rod or bait to see its stats. Click to equip. Scroll sideways for more.</div></div></div>
  <div id="modal"></div>
  <div id="touch"><div id="pad"><div id="padk"></div></div><div id="tRun">RUN</div><div id="tAct">CAST</div></div>
</div>
<script>
'use strict';
/* ================= setup ================= */
let VW=512,VH=384;const TS=16,MW=72,MH=44;const ZOOMS=[[320,240],[384,288],[448,336],[512,384]];let zoomI=3;
const cv=document.getElementById('c'),dctx=cv.getContext('2d');
const wcv=document.createElement('canvas');wcv.width=VW;wcv.height=VH;
const wctx=wcv.getContext('2d');let ctx=wctx;ctx.imageSmoothingEnabled=false;
let KS=1;
function fitCanvas(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1,w=Math.max(2,Math.round(r.width*d)),h=Math.max(2,Math.round(r.height*d));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}KS=cv.width/VW;}
const R=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const rect=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);};
const FONT='Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif';
function text(s,x,y,col,align,size){
  ctx.font='600 '+(size||9)+'px '+FONT;ctx.textAlign=align||'left';ctx.textBaseline='top';
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillText(s,x+.7,y+.7);
  ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);
}
function rrect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
const SOFTB={'#e0b94e':1,'#3a4b94':1,'#5b7fd6':1,'#0e1534':1};
function panel(x,y,w,h,bg,bd){rrect(x,y,w,h,4);ctx.fillStyle='rgba(10,16,34,.86)';ctx.fill();ctx.strokeStyle=bd&&!SOFTB[bd]?bd:'rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.stroke();}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=(x,y)=>((x*73856093)^(y*19349663))>>>0;

/* ================= audio ================= */
let AC=null,muted=false,master=null,waveG=null,rainG=null;
function audioInit(){
  if(!AC){
    try{
      AC=new(window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
      const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const mkN=(type,freq)=>{const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(master);s.start();return g;};
      waveG=mkN('lowpass',420);rainG=mkN('highpass',2400);
    }catch(e){}
  }
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function tone(f,d,type,v,f2,delay){
  if(!AC||muted)return;
  try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const SFX={
  cast(){tone(500,.25,'sawtooth',.04,120);},splash(){tone(200,.12,'triangle',.06,60);},
  bite(){tone(880,.08,'square',.06);tone(1175,.12,'square',.06,null,.09);},hook(){tone(300,.1,'square',.06,700);},
  catchy(r){[523,659,784,1047,1319].slice(0,3+Math.min(2,r)).forEach((f,i)=>tone(f,.14,'square',.05,null,i*.09));},
  fail(){tone(320,.4,'sawtooth',.05,70);},coin(){tone(988,.06,'square',.05);tone(1319,.12,'square',.05,null,.06);},
  tick(){tone(1500,.02,'square',.012);},charge(p){tone(300+p*500,.03,'square',.015);},
  open(){[392,523,659,784].forEach((f,i)=>tone(f,.1,'triangle',.06,null,i*.07));},ping(){tone(1400,.08,'sine',.05);tone(1900,.14,'sine',.04,null,.08);}
};

/* ================= data ================= */
const RAR=[
 {n:'Junk',c:'#9a9a9a',w:6,bar:1.3,spd:.26,dr:.09},{n:'Common',c:'#d6dee3',w:50,bar:1.12,spd:.34,dr:.13},

function hexRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgbHex(r,g,b){const c=v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');return '#'+c(r)+c(g)+c(b);}

function baitDesc(b){const d={realm:{r:'reef fish',d:'deep-sea fish',f:'freshwater fish'},clim:{c:'cold-water fish'}};let t=b.bt==='realm'?d.realm[b.bv]:b.bt==='clim'?d.clim[b.bv]:b.bt==='arch'?b.bv.join(' and '):b.bt==='tab'?b.bv.map(i=>DEXT[i].toLowerCase()).join(' and '):b.bt==='tier'?'rare+ fish':'';return b.bt?'x'+b.m+' chance for '+t+'. Luck +'+Math.round(b.luck*100)+'%, bites '+Math.round((1-b.speed)*100)+'% sooner.':'Luck +'+Math.round(b.luck*100)+'%, bites '+Math.round((1-b.speed)*100)+'% sooner.';}
function newQ2(){const tabs=[...new Set(REG.pool.filter(e=>!e.f.junk).map(e=>e.f.tab))],tab=tabs[Math.floor(R()*tabs.length)];const n=2+Math.floor(R()*3);return{tab,n,reward:60+n*70+Math.floor(R()*60)};}
function openVendor(v){VM=v;UI=vendorCfg(v);UI.act=a=>vact(a);open_('');renderUI();}
function vact(a){
  const [k,arg]=a.split(':'),v=VM;let ok=false;save.rods=save.rods||{};save.ench=save.ench||{};save.tune=save.tune||{};
  const spend=c=>{if(save.coins<c)return false;save.coins-=c;return true;};
  if(k==='buyrod'){const r=RODS[+arg];if(!rodOwn(r.id)&&spend(r.cost)){save.rods[r.id]=true;save.rod=r.id;ok=true;}}
  else if(k==='eq'){save.rod=+arg;ok=true;}
  else if(k==='ench'){const e=ENCH.find(x=>x.id===arg);if(spend(e.c)){save.ench[save.rod]=arg;ok=true;}}
  else if(k==='unench'){delete save.ench[save.rod];ok=true;}
  else if(k==='bait'){const b=BAITS.find(x=>x.id===arg);if(spend(b.price)){save.baits[b.id]=(save.baits[b.id]||0)+b.pack;ok=true;}}
  else if(k==='sell1'){const b=save.bag[+arg];if(b){if(precious(b)&&sellConf!==sellKey(b)){sellConf=sellKey(b);renderUI();return;}sellConf='';save.coins+=Math.round(priceOf(b)*(1+v.pc));save.bag.splice(+arg,1);ok=true;}}
  else if(k==='sellall'){if(save.bag.some(b=>v.cat(FISH[b.id])&&precious(b))&&sellConf!=='ALL'){sellConf='ALL';renderUI();return;}sellConf='';let t=0;save.bag=save.bag.filter(b=>{if(v.cat(FISH[b.id])){t+=Math.round(priceOf(b)*(1+v.pc));return false;}return true;});save.coins+=t;ok=true;}
  else if(k==='tune'){const id=save.rod,lv=save.tune[id]||0,c=Math.round((RODS[id].t+1)*60*Math.pow(1.7,lv));if(lv<5&&spend(c)){save.tune[id]=lv+1;ok=true;}}
  else if(k==='wx'){const c={rain:140,clear:60,day:80,night:120,dawn:90}[arg];if(spend(c)){if(arg==='rain'){S.raining=true;S.rainT=70;}else if(arg==='clear'){S.raining=false;S.rainT=150;}else if(arg==='day')S.clock=60;else if(arg==='night')S.clock=300*.78;else if(arg==='dawn')S.clock=300*.93;ok=true;}}
  else if(k==='roll'){const b=save.bag[+arg],c=Math.max(5,Math.round(b.val*.3));if(b&&!b.mut&&spend(c)){if(R()<.22){const m=['shiny','albino','giant','glow'][Math.floor(R()*4)];b.mut=m;b.val=Math.round(b.val*MUT[m].m);SFX.catchy(4);pop(P.x,P.y-40,MUT[m].n+'!',MUT[m].c);}else pop(P.x,P.y-40,'Nothing...','#ff9a8a');ok=true;}}
  else if(k==='scout'){if(hotspots.length>=HOTMAX){say('Plenty of hotspots already!');}else if((S.scoutCd||0)>0){say('The scout needs '+Math.ceil(S.scoutCd)+'s to look again.');}else if(spend(scoutCost())){spawnHotspot();spawnHotspot();S.scoutCd=45;ok=true;}}
  else if(k==='claim'){const r=RODS[+arg],n=FISH.filter(f=>save.caught[f.id]&&!f.junk).length;if(n>=+r.sa&&!rodOwn(r.id)){grantRod(r.id);ok=true;}}
  else if(k==='page'){const i=+arg,c=FISH.filter(f=>save.caught[f.id]&&f.tab===i).length,kk=Math.floor(c/10),got=save.pageR[i]||0;if(kk>got){save.coins+=(kk-got)*200;save.pageR[i]=kk;SFX.coin();ok=true;}}
  else if(k==='cook'){const b=save.bag[+arg];if(b){const f=FISH[b.id],lk=Math.min(.35,.05+f.rar*.04+Math.min(.08,Math.log10(1+f.kg)*.03));if(save.buff&&save.buff.t>30&&save.buff.luck>=lk){say('You are still full from a stronger meal.');return;}save.buff={luck:lk,t:(3+f.rar)*60};save.bag.splice(+arg,1);SFX.open();pop(P.x,P.y-40,'+'+Math.round(lk*100)+'% luck','#8aff9a');ok=true;}}
  else if(k==='bagx'){const n=save.bagX||0,c=Math.round(150*Math.pow(n+1,1.6));if(n<6&&spend(c)){save.bagX=n+1;ok=true;}}

const bagCount=id=>save.bag.filter(f=>f.id===id).length;
function interact(o){
  const n=o.npc;if(n){const dx=P.x-n.x,dy=P.y-n.y;n.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}

      let rem=q.n;save.bag.sort((a,b)=>a.val-b.val);

      save.quest=newQuest();persist();

/* ================= fishing ================= */
function facingFirstWater(){
  const [dx,dy]=DV[P.dir],tx0=Math.floor(P.x/TS),ty0=Math.floor(P.y/TS);
  for(let k=1;k<=reach();k++){const x=tx0+dx*k,y=ty0+dy*k;if(!inb(x,y))return -1;if(isWater(T[ti(x,y)]))return k;}
  return -1;
}
function castTargetFor(pw){
  const f=facingFirstWater();if(f<0)return null;
  const [dx,dy]=DV[P.dir],tx0=Math.floor(P.x/TS),ty0=Math.floor(P.y/TS),rg=reach();
  let k=clamp(Math.round(lerp(2,rg,pw)),f,rg);
  while(k>f&&!(inb(tx0+dx*k,ty0+dy*k)&&isWater(T[ti(tx0+dx*k,ty0+dy*k)])))k--;
  const tx=tx0+dx*k,ty=ty0+dy*k;
  return {x:tx*TS+8,y:ty*TS+8,tx,ty,k};
}
function hotNear(t){return hotspots.some(h=>Math.hypot(h.x-t.x,h.y-t.y)<TS*1.6);}
function beginCharge(){

}
function startCast(){

}

}
/* chest payout is priced in catches, not in savings: about two average catches of this place at your current rod luck */
let CHV={k:'',v:0};
function avgCatch(){

function finishCatch(){

  let mut=null;
  const mm=Math.min(2.2,1+rod().mut),rl=R(),pg=(night?.016:.004)*mm,ps=.012*mm,pa=.01*mm,pgi=.02*mm;if(rl<pg)mut='glow';else if(rl<pg+ps)mut='shiny';else if(rl<pg+ps+pa)mut='albino';else if(rl<pg+ps+pa+pgi)mut='giant';if(f.junk)mut=null;
  const u=Math.pow(R(),1.6);let w=f.wmin+u*(f.wmax-f.wmin);if(mut==='giant')w*=1.8;w=+w.toPrecision(3);
  S.streak++;

  const val=Math.max(1,Math.round(f.val*(.7+.6*u)*(mut?MUT[mut].m:1)*streakM*(flawless?1.25:1)));
  const rec=save.caught[f.id]||(save.caught[f.id]={n:0,best:0,muts:{}});
  const isNew=rec.n===0,record=!isNew&&w>rec.best;rec.n++;rec.best=Math.max(rec.best,w);rec.where=rec.where||{};rec.where[REG.country]=(rec.where[REG.country]||0)+1;checkRodGrants(f);if(mut){rec.muts=rec.muts||{};rec.muts[mut]=1;}
  save.bag.push({id:f.id,w,mut,val});save.total++;persist();

  shake(f.rar>=4||mut?4:2);

function failFight(timeout){SFX.fail();S.streak=0;say(timeout?'It slipped off the hook...':'The fish escaped!');splash(S.bx,S.by,14,70);S.state='idle';S.fight=null;}
function fightUpdate(dt){
  const F=S.fight,fi=S.fish,r=RAR[fi.rar],shark=fi.arch==='shark';
  F.time+=dt;F.shake=Math.max(0,F.shake-dt*3);
  if(!S.hold)S.holdLock=false;
  const hold=S.hold&&!S.holdLock;
  if(fi.beh==='sweeper'){
    F.rt-=dt;
    if(F.rt<=0){F.rt=.8+R()*1.8;if(R()<.55)F.dir*=-1;if(R()<.4+(shark?.25:0)+.1*r.spd){F.dash=.35;F.shake=1;}}
    const sp=r.spd*(shark?1.35:1.1)*(F.dash>0?2.6:1)*.9;F.dash=Math.max(0,F.dash-dt);
    F.x+=F.dir*sp*dt;if(F.x>.92){F.x=.92;F.dir=-1;}if(F.x<.08){F.x=.08;F.dir=1;}
  }else if(fi.beh==='darty'){
    F.rt-=dt;
    if(F.mode==='hold'){if(F.rt<=0){F.mode='dash';F.target=clamp(F.x+(R()<.5?-1:1)*(.25+R()*.4),.08,.92);F.shake=1;}}
    else{const dd=F.target-F.x,stp=r.spd*3.4*dt;if(Math.abs(dd)<=stp){F.x=F.target;F.mode='hold';F.rt=.35+R()*.8/(.5+r.spd);}else F.x+=Math.sign(dd)*stp;}
  }else{
    const fast=fi.beh==='erratic';F.rt-=dt;
    if(F.rt<=0){F.rt=(fast?.15+R()*.35:.35+R()*.9)/(.6+r.spd);const span=(.25+r.spd*.45)*(fast?1.4:1);F.target=clamp(F.x+(R()*2-1)*span,.08,.92);if(R()<(fast?.3:.12)+.1*r.spd){F.dash=.25;F.shake=1;}}
    const sp=r.spd*(F.dash>0?2.4:1)*(fast?1.15:1);F.dash=Math.max(0,F.dash-dt);const dd=F.target-F.x;F.x+=Math.sign(dd)*Math.min(Math.abs(dd),sp*dt);
  }
  F.x=clamp(F.x,.05,.95);
  if(F.x<.1||F.x>.9)F.edgeT+=dt;else F.edgeT=0;
  if(F.edgeT>.45&&fi.beh!=='sweeper'){F.edgeT=0;F.target=.5+(R()-.5)*.5;F.rt=.2;F.dash=.25;if(fi.beh==='darty')F.mode='dash';}
  F.v+=(hold?3.4:-3.0)*rod().ctrl*dt;F.v*=1-1.9*dt;F.v=clamp(F.v,-1.2,1.2);F.p+=F.v*dt;
  const half=F.bw/2;
  if(F.p<half){F.p=half;F.v=Math.abs(F.v)*.3;}if(F.p>1-half){F.p=1-half;F.v=-Math.abs(F.v)*.3;}
  const inside=Math.abs(F.x-F.p)<=half+.015;F.inside=inside;
  if(inside){F.prog+=(.28+rod().grip)*dt;F.tickT-=dt;if(F.tickT<=0){F.tickT=.2;SFX.tick();}}
  else{if(F.time>.6){F.prog-=r.dr*(1-rod().grip*.6)*(1-rod().resil)*dt;F.missT+=dt;}}
  if(!inside&&F.time>.6){F.warnT=(F.warnT||0)-dt;if(F.warnT<=0){F.warnT=.45;tone(170,.08,'sawtooth',.015);}}
  if(R()<dt*(inside?5:9))splash(S.bx+(F.x-.5)*16,S.by,2,40);
  if(F.prog>=1)finishCatch();else if(F.prog<=0)failFight(false);else if(F.time>90)failFight(true);
}

/* ================= movement ================= */
function boxFree(x,y){return[[x-4,y-3],[x+4,y-3],[x-4,y+2],[x+4,y+2]].every(([px,py])=>walkable(Math.floor(px/TS),Math.floor(py/TS)));}
function waterFree(x,y){return[[x-6,y-5],[x+6,y-5],[x-6,y+4],[x+6,y+4]].every(([px,py])=>{const tx=Math.floor(px/TS),ty=Math.floor(py/TS);return inb(tx,ty)&&T[ti(tx,ty)]===0&&!SOL[ti(tx,ty)];});}
function landAhead(){const [dx,dy]=DV[P.dir];for(const d of [10,16,22,28]){const tx=Math.floor((P.x+dx*d)/TS),ty=Math.floor((P.y+dy*d)/TS);if(walkable(tx,ty)&&boxFree(tx*TS+8,ty*TS+8))return {x:tx*TS+8,y:ty*TS+8};}return null;}
function landNear(){let best=null,bs=1e9;const [dx,dy]=DV[P.dir],tx0=Math.floor(P.x/TS),ty0=Math.floor(P.y/TS);
  for(let y=ty0-3;y<=ty0+3;y++)for(let x=tx0-3;x<=tx0+3;x++){if(!walkable(x,y)||!boxFree(x*TS+8,y*TS+8))continue;const ex=x*TS+8-P.x,ey=y*TS+8-P.y,d=Math.hypot(ex,ey);if(d>52)continue;const sc=d-(d?(ex*dx+ey*dy)/d*8:0);if(sc<bs){bs=sc;best={x:x*TS+8,y:y*TS+8};}}
  return best;}
function disembark(l){BT.x=P.x;BT.y=P.y;BT.dir=P.dir;P.x=l.x;P.y=l.y;P.aboard=false;SFX.splash();splash(BT.x,BT.y,8);}
function move(dt){
  let dx=0,dy=0;
  if(keys.KeyA||keys.ArrowLeft)dx--;if(keys.KeyD||keys.ArrowRight)dx++;
  if(keys.KeyW||keys.ArrowUp)dy--;if(keys.KeyS||keys.ArrowDown)dy++;
  P.moving=!!(dx||dy);
  if(!P.moving)return false;
  const run=keys.ShiftLeft||keys.ShiftRight,len=Math.hypot(dx,dy),base=P.aboard?BOATS[save.boat-1].speed*(run?1.2:1):(run?100:64),sp=base*dt,vx=dx/len*sp,vy=dy/len*sp;
  const free=P.aboard?waterFree:boxFree;
  if(free(P.x+vx,P.y))P.x+=vx;if(free(P.x,P.y+vy))P.y+=vy;
  if(dx&&!dy)P.dir=dx>0?'right':'left';else if(dy&&!dx)P.dir=dy>0?'down':'up';
  else if(!((P.dir==='left'||P.dir==='right')&&dx)&&!((P.dir==='up'||P.dir==='down')&&dy))P.dir=dx>0?'right':'left';
  P.anim+=dt*(run?13:9);
  if(P.aboard){S.stepT-=dt;if(S.stepT<=0){S.stepT=.22;ripple(P.x-DV[P.dir][0]*14,P.y-DV[P.dir][1]*10);}return true;}
  S.stepT-=dt;if(S.stepT<=0){S.stepT=run?.17:.26;parts.push({x:P.x-2+R()*4,y:P.y+1,vx:(R()-.5)*8,vy:-6,life:.25,c:'rgba(240,225,180,.8)',g:20});
    const tx=Math.floor(P.x/TS),ty=Math.floor(P.y/TS);if(T[ti(tx,ty)]===1)prints.push({x:P.x+((prints.length&1)?2:-2),y:P.y,life:9});}
  return true;
}

/* ================= update ================= */
function pickWalkTarget(w){for(let i=0;i<14;i++){const tx=Math.floor(w.x/TS+(R()-.5)*14),ty=Math.floor(w.y/TS+(R()-.5)*10);if(walkable(tx,ty)&&!RES[ti(tx,ty)]){w.tx=tx*TS+8;w.ty=ty*TS+8;return;}}w.tx=w.x;w.ty=w.y;}
function update(dt){
  S.time+=dt;S.clock+=dt;
  if(S.edgeMsg>0)S.edgeMsg-=dt;if(S.msgT>0)S.msgT-=dt;if(S.flash>0)S.flash-=dt*2.5;if(S.fade>0)S.fade=Math.max(0,S.fade-dt*1.4);if(save.buff&&save.buff.t>0)save.buff.t-=dt;if(S.big){S.big.t-=dt;if(S.big.t<=0)S.big=null;}if(S.hintT>0)S.hintT-=dt;if(S.shk>0)S.shk=Math.max(0,S.shk-dt*8);
  if(S.card){S.card.t-=dt;if(S.card.t<=0)S.card=null;}
  /* weather */
  S.rainT-=dt;if(S.rainT<=0){S.raining=!S.raining;S.rainT=S.raining?45+R()*40:110+R()*90;}
  S.rain+=((S.raining?1:0)-S.rain)*Math.min(1,dt*.6);
  S.demandT-=dt;if(S.demandT<=0)newDemand();
  if(waveG){waveG.gain.value=.018+.012*Math.sin(S.time*.7);rainG.gain.value=S.rain*.035;}
  if(S.scoutCd>0)S.scoutCd-=dt;
  hotspots.forEach((h,i)=>{h.life-=dt;h.ph+=dt;});
  for(let i=hotspots.length-1;i>=0;i--)if(hotspots[i].life<=0){hotspots.splice(i,1);if(hotspots.length<2)spawnHotspot();}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy+=(p.g||180)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=12*dt;r.a-=dt*.8;if(r.a<=0)ripples.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.life-=dt;p.y-=14*dt;if(p.life<=0)pops.splice(i,1);}
  for(let i=prints.length-1;i>=0;i--){prints[i].life-=dt;if(prints[i].life<=0)prints.splice(i,1);}
  gulls.forEach(g=>{g.x+=g.v*dt;g.ph+=dt*6;if(g.x>MW*TS+20)g.x=-20;if(g.x<-20)g.x=MW*TS+20;});
  drops.forEach(d=>{d.y+=260*dt*d.v;d.x-=70*dt*d.v;if(d.y>VH){d.y=-6;d.x=R()*(VW+60);}if(d.x<-6)d.x=VW+R()*40;});
  fshadow.forEach(s=>{
    const nx=s.x+Math.cos(s.a)*s.v*dt,ny=s.y+Math.sin(s.a)*s.v*dt,tx=Math.floor(nx/TS),ty=Math.floor(ny/TS);
    if(inb(tx,ty)&&T[ti(tx,ty)]===0&&DEP[ti(tx,ty)]>=1){s.x=nx;s.y=ny;if(R()<dt*.3)s.a+=(R()-.5);}else s.a+=Math.PI*(.6+R()*.8);
  });
  NPCS.forEach(n=>{if(n.shake>0)n.shake-=dt;});
  crabs.forEach(c=>{
    c.t-=dt;const d=Math.hypot(c.x-P.x,c.y-P.y);
    if(d<44){const a=Math.atan2(c.y-P.y,c.x-P.x);c.vx=Math.cos(a)*38;c.vy=Math.sin(a)*38;c.t=.3;}
    else if(c.t<=0){c.t=.6+R()*2;if(R()<.5){c.vx=c.vy=0;}else{c.vx=(R()<.5?-1:1)*16;c.vy=(R()-.5)*8;}}
    const nx=c.x+c.vx*dt,ny=c.y+c.vy*dt,ok=(x,y)=>{const tx=Math.floor(x/TS),ty=Math.floor(y/TS);return inb(tx,ty)&&T[ti(tx,ty)]===1&&!SOL[ti(tx,ty)];};
    if(ok(nx,c.y))c.x=nx;else c.vx*=-1;if(ok(c.x,ny))c.y=ny;else c.vy*=-1;
    c.f+=dt*(Math.abs(c.vx)>1?10:0);
  });
  /* camera */
  let tx=P.x,ty=P.y;
  if(S.tgt&&['casting','waiting','bite','fight'].includes(S.state)){tx=lerp(P.x,S.tgt.x,.3);ty=lerp(P.y,S.tgt.y,.3);}
  const k=1-Math.exp(-5*dt);
  CAM.x+=(clamp(tx-VW/2,0,MW*TS-VW)-CAM.x)*k;CAM.y+=(clamp(ty-VH/2,0,MH*TS-VH)-CAM.y)*k;
  if(S.menu)return;
  const st=S.state;
  shells.forEach(s=>{
    if(s.t>0){s.t-=dt;if(s.t<=0){const [x,y]=randSand();s.x=x;s.y=y;}return;}
    if(Math.hypot(s.x-P.x,s.y-P.y)<10){s.t=45;save.coins+=3;persist();SFX.coin();pop(s.x,s.y-8,'+3','#ffc0d8');}
  });
  CHESTS.forEach(c=>{
    if(c.open){c.t-=dt;if(c.t<=0)c.open=false;return;}
    if(Math.hypot(c.x-P.x,c.y-P.y)<16){c.open=true;c.t=save.boat>0?150:300;const v=chestValue();save.coins+=v;if(R()<(save.boat>0?.3:.15))chestRod();persist();SFX.open();pop(c.x,c.y-14,'+'+v+' coins');splash(c.x,c.y-6,16,70);shake(2);}
  });
  S.near=null;
  if(st==='idle'){let best=1e9;BT.int.x=BT.x;BT.int.y=BT.y;const lst=save.boat>0&&!P.aboard?INTS.concat([BT.int]):INTS;for(const o of lst){const d=Math.hypot(o.x-P.x,o.y-P.y);if(d<o.r&&d<best){best=d;S.near=o;}}}
  if(st==='idle')move(dt);
  if(st==='idle'){
    const dB=Math.min(P.x,P.y,MW*TS-P.x,MH*TS-P.y);
    if(dB>28){P.sx=P.x;P.sy=P.y;}
    S.edgeHint=!!(save.boat&&P.aboard&&dB<56);
    if(dB<12&&P.moving){if(save.boat){openMap(true);}else if(S.edgeMsg<=0){say('Buy a boat from Marlo to explore the world.');S.edgeMsg=5;}}
  }
  WALK.forEach(w=>{
    if(w.wait>0){w.wait-=dt;w.mv=false;return;}
    const dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy);
    if(d<2){w.wait=1+R()*4;pickWalkTarget(w);w.mv=false;return;}
    const sp=20*dt,vx=dx/d*sp,vy=dy/d*sp;let moved=false;
    if(boxFree(w.x+vx,w.y)){w.x+=vx;moved=true;}if(boxFree(w.x,w.y+vy)){w.y+=vy;moved=true;}
    if(!moved){w.stuck=(w.stuck||0)+dt;if(w.stuck>.5){w.stuck=0;pickWalkTarget(w);}}
    w.mv=moved;w.anim+=dt*6;if(Math.abs(dx)>Math.abs(dy))w.dir=dx>0?'right':'left';else w.dir=dy>0?'down':'up';
  });
  if(P.aboard){BT.x=P.x;BT.y=P.y;BT.dir=P.dir;}
  else if(st==='charging'){if(move(dt)){S.state='idle';}}
  else if(st==='waiting'||st==='bite'){if(move(dt))reelIn('Reeled in.');}
  switch(S.state){
    case 'charging':{
      const o=S.power;S.power+=S.pdir*dt*1.35;
      if(S.power>=1){S.power=1;S.pdir=-1;}if(S.power<=0){S.power=0;S.pdir=1;}
      if(Math.floor(o*12)!==Math.floor(S.power*12))SFX.charge(S.power);
      break;}
    case 'casting':{
      S.castT+=dt/.45;const t=Math.min(1,S.castT),tip=rodTip();
      S.bx=lerp(tip[0],S.tgt.x,t);S.by=lerp(tip[1],S.tgt.y,t)-Math.sin(Math.PI*t)*26;
      if(t>=1){
        S.bx=S.tgt.x;S.by=S.tgt.y;splash(S.bx,S.by,10);ripple(S.bx,S.by);SFX.splash();
        S.depth=DEP[ti(S.tgt.tx,S.tgt.ty)];S.hot=hotNear(S.tgt);
        S.state='waiting';S.wt=0;S.rip=0;S.wait=calcWait();
        S.fish=pickFish({depth:S.depth,luck:rod().luck+(S.bait?S.bait.luck:0)+(P.aboard&&save.boat?BOATS[save.boat-1].luck:0)+(S.perfect?.2:0)+(S.hot?.2:0)+S.rain*.1+(save.buff&&save.buff.t>0?save.buff.luck:0)+(P.aboard&&save.boat?(save.boatTune||0)*.04:0)});
        if(S.hot){say('HOTSPOT!');SFX.ping();}else if(S.perfect)say('PERFECT CAST!');
      }
      break;}
    case 'waiting':
      S.wt+=dt;S.rip+=dt;if(S.rip>1.3){S.rip=0;ripple(S.bx,S.by);}
      S.nibT=(S.nibT===undefined?1:S.nibT)-dt;if(S.nibT<=0&&S.wt<S.wait-.5){S.nibT=1.2+R()*1.6;splash(S.bx,S.by,2,22);ripple(S.bx,S.by);tone(700+R()*200,.04,'sine',.02);}
      if(S.wt>=S.wait){S.state='bite';S.biteT=1.2;SFX.bite();splash(S.bx,S.by,10);ripple(S.bx,S.by);shake(3);}
      break;
    case 'bite':
      S.biteT-=dt;if(R()<dt*10)ripple(S.bx,S.by);
      if(S.biteT<=0){S.streak=0;reelIn('Too slow... it swam off.');}
      break;
    case 'fight':fightUpdate(dt);break;
    case 'reel':S.reelT-=dt;if(S.arc)S.arc.t+=dt/.6;if(S.reelT<=0){S.state='idle';S.arc=null;}break;
  }
}

/* ================= drawing ================= */
function rodTip(){const [dx,dy]=DV[P.dir];return [P.x+dx*16,dy===0?P.y-14:P.y-9+dy*15];}
function drawLineTo(x0,y0,x1,y1,sag,col){
  const n=Math.ceil(Math.hypot(x1-x0,y1-y0));
  for(let i=0;i<=n;i++){const t=i/n;rect(lerp(x0,x1,t)-cam.x,lerp(y0,y1,t)+Math.sin(Math.PI*t)*sag-cam.y,1,1,col);}
}
function drawBoatAt(x,y,dir,t,bob){
  const sp=BOAT_SPR[t][dir];ctx.fillStyle='rgba(0,20,60,.22)';ctx.fillRect(Math.round(x-sp.width/2-cam.x)+1,Math.round(y-sp.height/2-cam.y)+3,sp.width,sp.height);
  ctx.drawImage(sp,Math.round(x-sp.width/2-cam.x),Math.round(y-sp.height/2+bob-cam.y));
}
function drawPlayer(){
  if(P.aboard){
    const bob=Math.round(Math.sin(S.time*2)*.7),spr=CH_PLAYER[P.dir][1],rodOut=['charging','casting','waiting','bite','fight','reel'].includes(S.state);
    drawBoatAt(P.x,P.y,P.dir,save.boat,bob);
    if(rodOut&&P.dir==='up')rodDraw();
    ctx.drawImage(spr,0,0,spr.width,15,Math.round(P.x-9-cam.x),Math.round(P.y-17+bob-cam.y),spr.width,15);
    if(rodOut&&P.dir!=='up')rodDraw();
    return;
  }
  const rodOut=['charging','casting','waiting','bite','fight','reel'].includes(S.state);
  const frame=P.moving?(Math.floor(P.anim)%2):1,spr=CH_PLAYER[P.dir][frame],bob=P.moving&&Math.floor(P.anim)%2===0?-1:0;
  rect(P.x-6-cam.x,P.y-1-cam.y,12,3,'rgba(0,0,0,.25)');
  if(rodOut&&P.dir==='up')rodDraw();
  ctx.drawImage(spr,Math.round(P.x-9-cam.x),Math.round(P.y-20+bob-cam.y));
  if(rodOut&&P.dir!=='up')rodDraw();
}
function rodDraw(){
  const tip=rodTip(),[dx,dy]=DV[P.dir],hx=P.x+dx*5+(dy?6:0),hy=P.y-8;
  let bend=S.state==='fight'?3+S.fight.shake*3:S.state==='bite'?3:1;
  let ox=0,oy=0;if(S.state==='charging'){ox=-dx*S.power*5;oy=(dy?-dy:1)*S.power*3;bend+=S.power*3;}
  const n=20;
  for(let i=0;i<=n;i++){const t=i/n;rect(lerp(hx,tip[0]+ox,t)-cam.x,lerp(hy,tip[1]+oy,t)+bend*t*t-cam.y,1,1,i%6<3?'#8a5a2a':'#6a4220');}
}
function drawBobberAndLine(){
  const st=S.state;if(!['casting','waiting','bite','fight'].includes(st))return;
  const tip=rodTip();let bx=S.bx,by=S.by;
  if(st==='casting'){drawLineTo(tip[0],tip[1],bx,by,0,'rgba(255,255,255,.85)');rect(bx-2-cam.x,by-3-cam.y,4,3,'#e8362d');rect(bx-2-cam.x,by-cam.y,4,2,'#fff');return;}
  let dip=0;
  if(st==='waiting')dip=Math.round(Math.sin(S.time*3));
  if(st==='bite')dip=2+(Math.floor(S.time*20)%2)*2;
  if(st==='fight'){dip=Math.floor(S.time*14)%2;bx+=Math.round((S.fight.x-.5)*16);}
  by+=dip;
  drawLineTo(tip[0],tip[1],bx,by-5,st==='waiting'?6:1,'rgba(255,255,255,.9)');
  const X=Math.round(bx-cam.x),Y=Math.round(by-cam.y);
  rect(X,Y-9,1,3,'#222');rect(X-2,Y-6,4,3,'#e8362d');rect(X-2,Y-3,4,2,'#fff');rect(X-4,Y-1,8,1,'#cfe6ff');
}
function drawBubbleAlert(){
  const bob=Math.round(Math.sin(S.time*10)),X=Math.round(P.x-cam.x-6),Y=Math.round(P.y-cam.y-44+bob);
  rect(X-1,Y-1,14,18,'#2a2a3a');rect(X,Y,12,16,'#fff');rect(X+5,Y+3,2,6,'#e03030');rect(X+5,Y+11,2,2,'#e03030');
  rect(X+4,Y+16,4,2,'#2a2a3a');rect(X+5,Y+16,2,1,'#fff');
}
function pictoBubble(cx,cy,f,label,col,shk){
  const sp=fishSprite(f),w=sp.width+ctxW(label)+10,h=20,bob=Math.round(Math.sin(S.time*2+cx)*1)+(shk>0?Math.round((R()-.5)*3):0);
  const X=Math.round(cx-cam.x-w/2),Y=Math.round(cy-cam.y-h-26+bob);
  panel(X,Y,w,h,'#18224a','#e0b94e');rect(X+w/2-2,Y+h,4,2,'#e0b94e');rect(X+w/2-1,Y+h,2,1,'#18224a');
  ctx.drawImage(sp,X+4,Y+Math.round((h-sp.height)/2));text(label,X+sp.width+7,Y+6,col);
}
function ctxW(s){ctx.font='600 9px '+FONT;return Math.ceil(ctx.measureText(s).width);}

function renderWorld(){
  const sh=S.shk>0?Math.round((R()-.5)*S.shk):0,sh2=S.shk>0?Math.round((R()-.5)*S.shk):0;
  cam.x=clamp(Math.round(CAM.x)+sh,0,MW*TS-VW);cam.y=clamp(Math.round(CAM.y)+sh2,0,MH*TS-VH);
  ctx.drawImage(GR[Math.floor(S.clock*2)%2],cam.x,cam.y,VW,VH,0,0,VW,VH);
  /* fish shadows & hotspots */
  ctx.globalAlpha=.22;
  fshadow.forEach(s=>{const x=Math.round(s.x-cam.x),y=Math.round(s.y-cam.y);if(x<-30||y<-30||x>VW+30||y>VH+30)return;
    const sp=shadowSpr[s.k];ctx.save();ctx.translate(x,y);if(Math.cos(s.a)<0)ctx.scale(-1,1);ctx.drawImage(sp,-sp.width/2,-sp.height/2);ctx.restore();});
  ctx.globalAlpha=1;
  hotspots.forEach(h=>{
    const x=Math.round(h.x-cam.x),y=Math.round(h.y-cam.y);if(x<-30||y<-30||x>VW+30||y>VH+30)return;
    ctx.globalAlpha=.25+.1*Math.sin(h.ph*3);ctx.fillStyle='#bfe8ff';ctx.beginPath();ctx.ellipse(x,y,15,9,0,0,7);ctx.fill();ctx.globalAlpha=1;
    for(let i=0;i<5;i++){const t=(h.ph*.8+i*.37)%1,bx=x+Math.round(Math.sin(i*2.3+h.ph)*9),by=y+4-Math.round(t*16);rect(bx,by,2,2,'#eaf8ff');rect(bx,by,1,1,'#fff');}
    const r=6+((h.ph*6)%8);for(let i=0;i<14;i++){const a=i/14*6.28;rect(x+Math.cos(a)*r,y+Math.sin(a)*r*.55,1,1,'rgba(255,255,255,.7)');}
  });
  drawRipples();
  prints.forEach(p=>{ctx.globalAlpha=clamp(p.life/9,0,1)*.5;rect(p.x-cam.x,p.y-cam.y,2,2,'#b79a5a');});ctx.globalAlpha=1;
  shells.forEach(s=>{if(s.t<=0)ctx.drawImage(SHELL,Math.round(s.x-4-cam.x),Math.round(s.y-3-cam.y+Math.sin(S.time*3+s.x)*.6));});
  /* sorted */
  const list=[];
  OBJS.forEach(o=>{if(o.vis&&!o.vis())return;list.push({sy:o.sy,draw:()=>o.draw(cam.x,cam.y)});});
  NPCS.forEach(n=>list.push({sy:n.y+2,draw:()=>{
    rect(n.x-6-cam.x,n.y-1-cam.y,12,3,'rgba(0,0,0,.25)');
    ctx.drawImage(n.set[n.dir][Math.floor(S.time*1.5)%2],Math.round(n.x-9-cam.x),Math.round(n.y-20-cam.y));}}));
  WALK.forEach(w=>list.push({sy:w.y+2,draw:()=>{rect(w.x-6-cam.x,w.y-1-cam.y,12,3,'rgba(0,0,0,.25)');ctx.drawImage(w.set[w.dir][w.mv?(Math.floor(w.anim)%2?0:2):1],Math.round(w.x-9-cam.x),Math.round(w.y-20-cam.y));}}));
  crabs.forEach(c=>list.push({sy:c.y,draw:()=>ctx.drawImage(CRAB[Math.floor(c.f)%2],Math.round(c.x-6-cam.x),Math.round(c.y-4-cam.y))}));
  if(save.boat>0&&!P.aboard)list.push({sy:BT.y+6,draw:()=>drawBoatAt(BT.x,BT.y,BT.dir,save.boat,Math.round(Math.sin(S.time*1.6+1)*.8))});
  list.push({sy:P.y+1,draw:drawPlayer});
  list.sort((a,b)=>a.sy-b.sy);list.forEach(o=>o.draw());
  drawBobberAndLine();
  if(S.state==='charging'){const t=castTargetFor(S.power);if(t){drawReticle(t);}}
  if(S.state==='bite')drawBubbleAlert();
  if(S.arc){const t=clamp(S.arc.t,0,1),sp=fishSprite(S.arc.f,S.arc.mut),x=lerp(S.bx,P.x,t),y=lerp(S.by,P.y-14,t)-Math.sin(Math.PI*t)*30;ctx.drawImage(sp,Math.round(x-sp.width/2-cam.x),Math.round(y-sp.height/2-cam.y));}
  parts.forEach(p=>rect(p.x-cam.x,p.y-cam.y,p.life>.35?2:1,p.life>.35?2:1,p.c));
  gulls.forEach(g=>{const up=Math.sin(g.ph)>0,x=Math.round(g.x-cam.x),y=Math.round(g.y-cam.y);if(x<-10||x>VW+10||y<-10||y>VH+10)return;
    rect(x-6,y+8,5,1,'rgba(0,0,0,.18)');
    if(up){rect(x-4,y-2,3,1,'#fff');rect(x-1,y-1,3,1,'#fff');rect(x+2,y-2,3,1,'#fff');}else{rect(x-4,y+1,3,1,'#fff');rect(x-1,y,3,1,'#fff');rect(x+2,y+1,3,1,'#fff');}});
  drawLighting();
  if(S.fade>0){ctx.globalAlpha=clamp(S.fade,0,1);rect(0,0,VW,VH,'#000');ctx.globalAlpha=1;}
  if(S.flash>0){ctx.globalAlpha=clamp(S.flash,0,1)*.5;rect(0,0,VW,VH,'#fff');ctx.globalAlpha=1;}
}
function drawWorldUi(){
  if(S.state==='idle'||S.state==='charging'){
    NPCS.forEach(n=>{
      if(Math.hypot(n.x-P.x,n.y-P.y)>120)return;
      if(n.id==='shop')pictoBubble(n.x+50,n.y+4,FISH[S.demand.id],'Wanted +60%','#8aff9a');
      else if(n.v)vendorBubble(n);
    });
  }
  pops.forEach(p=>{ctx.globalAlpha=clamp(p.life*2,0,1);text(p.t,p.x-cam.x,p.y-cam.y,p.c,'center');ctx.globalAlpha=1;});
  if(S.state==='charging'){
    const w=40,X=Math.round(P.x-cam.x-w/2),Y=Math.round(P.y-cam.y-42);
    panel(X-1,Y,w+2,8,'#0e1534','#e8edff');rect(X+1,Y+2,w-2,4,'#222a55');rect(X+1+Math.round((w-2)*.88),Y+2,Math.round((w-2)*.12),4,'#6b5a1a');
    rect(X+1,Y+2,Math.round((w-2)*S.power),4,S.power>=.88?'#ffd75e':'#4ade80');
  }
}
function render(){
  fitCanvas();
  ctx=wctx;ctx.imageSmoothingEnabled=false;
  renderWorld();
  dctx.setTransform(1,0,0,1,0,0);dctx.imageSmoothingEnabled=false;
  dctx.drawImage(wcv,0,0,VW,VH,0,0,cv.width,cv.height);
  ctx=dctx;
  dctx.setTransform(cv.width/VW,0,0,cv.height/VH,0,0);dctx.imageSmoothingEnabled=false;
  drawWorldUi();
  const ow=VW,oh=VH;VW=512;VH=384;
  dctx.setTransform(cv.width/512,0,0,cv.height/384,0,0);
  drawHud();
  VW=ow;VH=oh;ctx=wctx;dctx.setTransform(1,0,0,1,0,0);
}
function drawReticle(t){
  const x=Math.round(t.x-cam.x),y=Math.round(t.y-cam.y),hot=hotNear(t),deep=DEP[ti(t.tx,t.ty)]>=3,pulse=Math.sin(S.time*8)>0?1:0;
  const col=hot?'#ffe35e':deep?'#9fd0ff':'#fff';
  for(let i=0;i<16;i++){const a=i/16*6.28+S.time;if(i%2)continue;rect(x+Math.cos(a)*(9+pulse),y+Math.sin(a)*(5+pulse*.5),2,1,col);}
  text(hot?'HOT!':deep?'DEEP':'SHALLOW',x,y+10,col,'center',8);
}
function drawRipples(){
  ripples.forEach(r=>{ctx.globalAlpha=clamp(r.a,0,1)*.8;const n=Math.max(12,Math.round(r.r*4));
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2;rect(r.x+Math.cos(a)*r.r-cam.x,r.y+Math.sin(a)*r.r*.5-cam.y,1,1,'#eaf8ff');}});
  ctx.globalAlpha=1;
}
function drawLighting(){
  const nf=nightF(),p=phase();
  let a=0,col='20,30,90';
  if(p>.55&&p<.7){a=(p-.55)/.15*.14;col='255,120,60';}else if(nf>=1){a=.36;}else if(p>=.9){a=.36*(1-(p-.9)/.1);}
  if(S.rain>0){ctx.fillStyle='rgba(20,34,60,'+(S.rain*.22)+')';ctx.fillRect(0,0,VW,VH);}

  pad.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();padId=e.pointerId;try{pad.setPointerCapture(e.pointerId);}catch(_){}padMove(e);});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===padId){e.stopPropagation();padMove(e);}});
  const padEnd=e=>{if(e.pointerId!==padId)return;e.stopPropagation();padId=null;clearDir();};
  pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);pad.addEventListener('lostpointercapture',padEnd);
  act.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();if(S.menu)return;actId=e.pointerId;try{act.setPointerCapture(e.pointerId);}catch(_){}act.classList.add('on');S.hold=true;action();});
  const actEnd=e=>{if(e.pointerId!==actId)return;e.stopPropagation();actId=null;act.classList.remove('on');release();};
  act.addEventListener('pointerup',actEnd);act.addEventListener('pointercancel',actEnd);act.addEventListener('lostpointercapture',actEnd);
  run.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();keys.ShiftLeft=!keys.ShiftLeft;run.classList.toggle('on',!!keys.ShiftLeft);});
  window.addEventListener('blur',()=>{padId=actId=null;clearDir();act.classList.remove('on');});
  /* label follows what the button will do */
  setInterval(()=>{if(!document.body.classList.contains('touch'))return;let t='CAST';if(S.state==='charging')t='RELEASE';else if(S.state==='waiting')t='WAIT';else if(S.state==='bite')t='REEL!';else if(S.state==='fight')t='HOLD';else if(S.near)t='TALK';else if(P.aboard&&landAhead())t='LAND';if(act.textContent!==t)act.textContent=t;},120);
})();

/* ================= loop ================= */
let last=performance.now();
let _errN=0;
function loop(now){requestAnimationFrame(loop);const dt=clamp((now-last)/1000,0,.05);last=now;try{update(dt);render();}catch(e){if(_errN++<3)console.error(e);try{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;}catch(_){}if(S.state==='fight'||S.state==='casting'){S.state='idle';S.fight=null;}}}
startWorld();
if(/debug/.test(location.hash)){window.__travel=travelTo;window.__REG=()=>REG;window.__regionFor=regionFor;}
last=performance.now();requestAnimationFrame(loop);
if(/debug/.test(location.hash)){window.__S=S;window.__P=P;window.__save=save;window.__T=T;window.__hot=hotspots;window.__FISH=FISH;window.__RODS=RODS;window.__VEND=VEND;window.__grant=grantRod;window.__pick=pickFish;window.__vend=openVendor;window.__WG=WG;window.__NPCS=NPCS;window.__WALK=WALK;window.__CH=CHESTS;}
</script>
